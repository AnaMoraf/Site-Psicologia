<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!--
    Fundo natural do site: folhagem em camadas.
    - camada de trás  = bem desfocada (dá profundidade)
    - camada do meio  = pouco desfocada
    - camada da frente = NÍTIDA, com nervuras e brilho
    Se um dia você quiser usar uma FOTO de verdade no lugar deste desenho,
    veja a explicação no index.html (procure por "TROCAR O FUNDO").
  -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#F2ECE0"/>
      <stop offset="45%"  stop-color="#E4DACA"/>
      <stop offset="100%" stop-color="#CBBFA9"/>
    </linearGradient>

    <radialGradient id="luz" cx="74%" cy="14%" r="62%">
      <stop offset="0%"   stop-color="#FFF9EC" stop-opacity=".9"/>
      <stop offset="60%"  stop-color="#F4EAD7" stop-opacity=".2"/>
      <stop offset="100%" stop-color="#C9BCA6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="sombra" cx="10%" cy="94%" r="72%">
      <stop offset="0%"   stop-color="#5E5949" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#5E5949" stop-opacity="0"/>
    </radialGradient>

    <!-- verdes: do mais claro (sol) ao mais fechado (sombra) -->
    <linearGradient id="verdeClaro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#A9BC8C"/>
      <stop offset="100%" stop-color="#748A61"/>
    </linearGradient>
    <linearGradient id="verdeMedio" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#87A06D"/>
      <stop offset="100%" stop-color="#4F6746"/>
    </linearGradient>
    <linearGradient id="verdeFundo" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"   stop-color="#6E8460"/>
      <stop offset="100%" stop-color="#3F5439"/>
    </linearGradient>
    <linearGradient id="palha" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#D8CBA9"/>
      <stop offset="100%" stop-color="#A99777"/>
    </linearGradient>

    <!-- desfoques por camada -->
    <filter id="blurForte" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="blurMedio" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <!-- camada da frente: borda organica (ruido) + leve sombra -->
    <filter id="organico" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="3" seed="7" result="ruido"/>
      <feDisplacementMap in="SourceGraphic" in2="ruido" scale="9" xChannelSelector="R" yChannelSelector="G" result="borda"/>
      <feGaussianBlur in="borda" stdDeviation="1.1" result="suave"/>
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#3B3728" flood-opacity=".28"/>
    </filter>
    <filter id="grao" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <!-- FOLHA LARGA com nervura central e nervuras laterais -->
    <g id="folha">
      <path d="M0 0 C 52 -74, 196 -88, 306 0 C 196 88, 52 74, 0 0 Z"/>
      <g fill="none" stroke="#2C3A26" stroke-opacity=".22" stroke-linecap="round">
        <path d="M8 0 L 300 0" stroke-width="3.2"/>
        <path d="M52 -3 C 84 -26, 118 -40, 150 -46" stroke-width="1.7"/>
        <path d="M92 -3 C 124 -24, 156 -36, 190 -40" stroke-width="1.7"/>
        <path d="M134 -3 C 164 -20, 196 -30, 228 -33" stroke-width="1.6"/>
        <path d="M176 -2 C 204 -16, 230 -23, 258 -25" stroke-width="1.5"/>
        <path d="M52 3 C 84 26, 118 40, 150 46" stroke-width="1.7"/>
        <path d="M92 3 C 124 24, 156 36, 190 40" stroke-width="1.7"/>
        <path d="M134 3 C 164 20, 196 30, 228 33" stroke-width="1.6"/>
        <path d="M176 2 C 204 16, 230 23, 258 25" stroke-width="1.5"/>
      </g>
      <!-- brilho de sol na parte de cima da folha -->
      <path d="M24 -6 C 74 -56, 180 -66, 262 -14 C 180 -44, 78 -38, 24 -6 Z"
            fill="#FFFFFF" fill-opacity=".16"/>
    </g>

    <!-- FRONDE tipo palmeira/samambaia: talo + foliolos dos dois lados -->
    <g id="fronde">
      <rect x="0" y="-3.5" width="322" height="7" rx="3.5"/>
      <g>
        <ellipse cx="22"  cy="-21" rx="44" ry="15" transform="rotate(-26 22 -21)"/>
        <ellipse cx="58"  cy="-23" rx="47" ry="16" transform="rotate(-25 58 -23)"/>
        <ellipse cx="94"  cy="-22" rx="45" ry="15" transform="rotate(-24 94 -22)"/>
        <ellipse cx="130" cy="-20" rx="41" ry="14" transform="rotate(-23 130 -20)"/>
        <ellipse cx="166" cy="-18" rx="36" ry="12" transform="rotate(-22 166 -18)"/>
        <ellipse cx="200" cy="-16" rx="31" ry="11" transform="rotate(-21 200 -16)"/>
        <ellipse cx="234" cy="-13" rx="25" ry="9"  transform="rotate(-20 234 -13)"/>
        <ellipse cx="264" cy="-10" rx="19" ry="7"  transform="rotate(-18 264 -10)"/>
        <ellipse cx="292" cy="-7"  rx="13" ry="5"  transform="rotate(-16 292 -7)"/>
      </g>
      <g>
        <ellipse cx="22"  cy="21" rx="44" ry="15" transform="rotate(26 22 21)"/>
        <ellipse cx="58"  cy="23" rx="47" ry="16" transform="rotate(25 58 23)"/>
        <ellipse cx="94"  cy="22" rx="45" ry="15" transform="rotate(24 94 22)"/>
        <ellipse cx="130" cy="20" rx="41" ry="14" transform="rotate(23 130 20)"/>
        <ellipse cx="166" cy="18" rx="36" ry="12" transform="rotate(22 166 18)"/>
        <ellipse cx="200" cy="16" rx="31" ry="11" transform="rotate(21 200 16)"/>
        <ellipse cx="234" cy="13" rx="25" ry="9"  transform="rotate(20 234 13)"/>
        <ellipse cx="264" cy="10" rx="19" ry="7"  transform="rotate(18 264 10)"/>
        <ellipse cx="292" cy="7"  rx="13" ry="5"  transform="rotate(16 292 7)"/>
      </g>
    </g>

    <!-- galho com 4 folhas largas -->
    <g id="galho">
      <use href="#folha" transform="rotate(-27) scale(.60)"/>
      <use href="#folha" transform="rotate(11) scale(.52) translate(48 0)"/>
      <use href="#folha" transform="rotate(46) scale(.44) translate(74 0)"/>
      <use href="#folha" transform="rotate(-59) scale(.40) translate(62 0)"/>
    </g>
  </defs>

  <rect width="1600" height="1000" fill="url(#base)"/>

  <!-- CAMADA DE TRÁS (bem desfocada, preenche o miolo) -->
  <g filter="url(#blurForte)" opacity=".70">
    <use href="#galho"  transform="translate(180 260) scale(2.1)"               fill="url(#verdeFundo)"/>
    <use href="#fronde" transform="translate(1440 180) rotate(146) scale(2.2)"  fill="url(#verdeFundo)"/>
    <use href="#galho"  transform="translate(760 960) rotate(-98) scale(2.3)"   fill="url(#verdeMedio)"/>
    <use href="#fronde" transform="translate(1320 860) rotate(-156) scale(2.0)" fill="url(#palha)"/>
    <use href="#fronde" transform="translate(240 720) rotate(-18) scale(1.9)"   fill="url(#verdeMedio)"/>
    <use href="#galho"  transform="translate(1180 380) rotate(150) scale(1.8)"  fill="url(#verdeFundo)"/>
    <ellipse cx="430"  cy="640" rx="320" ry="220" fill="#7F9070" opacity=".40"/>
    <ellipse cx="1180" cy="430" rx="340" ry="240" fill="#9DAA83" opacity=".38"/>
    <ellipse cx="820"  cy="140" rx="360" ry="180" fill="#B7B393" opacity=".32"/>
  </g>

  <!-- CAMADA DO MEIO (pouco desfocada) -->
  <g filter="url(#blurMedio)" opacity=".80">
    <use href="#fronde" transform="translate(-40 320)  rotate(-4)  scale(1.50)" fill="url(#verdeMedio)"/>
    <use href="#galho"  transform="translate(1620 660) rotate(178) scale(1.50)" fill="url(#verdeMedio)"/>
    <use href="#fronde" transform="translate(430 -60)  rotate(70)  scale(1.30)" fill="url(#verdeClaro)"/>
    <use href="#galho"  transform="translate(1010 1010) rotate(-92) scale(1.40)" fill="url(#verdeFundo)"/>
    <use href="#fronde" transform="translate(140 980)  rotate(-42) scale(1.30)" fill="url(#verdeMedio)"/>
    <use href="#folha"  transform="translate(1430 -10) rotate(116) scale(1.25)" fill="url(#palha)"/>
    <use href="#fronde" transform="translate(1530 480) rotate(198) scale(1.35)" fill="url(#verdeClaro)"/>
    <use href="#galho"  transform="translate(620 1020) rotate(-70) scale(1.20)" fill="url(#verdeMedio)"/>
  </g>

  <!-- CAMADA DA FRENTE (nítida, com nervuras à mostra)
       Concentrada nas laterais e na faixa central de altura, que é a parte
       que sempre aparece na tela (o topo e o rodapé do desenho são cortados
       quando a janela é mais larga que alta). -->
  <g filter="url(#organico)" opacity=".94">
    <use href="#fronde" transform="translate(-30 210)  rotate(16)  scale(1.25)" fill="url(#verdeClaro)"/>
    <use href="#folha"  transform="translate(10 430)   rotate(-4)  scale(1.15)" fill="url(#verdeMedio)"/>
    <use href="#fronde" transform="translate(-20 640)  rotate(-16) scale(1.20)" fill="url(#verdeMedio)"/>
    <use href="#folha"  transform="translate(60 830)   rotate(-34) scale(1.05)" fill="url(#verdeClaro)"/>
    <use href="#folha"  transform="translate(180 120)  rotate(46)  scale(1.00)" fill="url(#verdeClaro)"/>

    <use href="#folha"  transform="translate(1590 250) rotate(172) scale(1.15)" fill="url(#verdeClaro)"/>
    <use href="#fronde" transform="translate(1630 470) rotate(196) scale(1.28)" fill="url(#verdeMedio)"/>
    <use href="#folha"  transform="translate(1580 700) rotate(160) scale(1.10)" fill="url(#verdeMedio)"/>
    <use href="#fronde" transform="translate(1600 880) rotate(214) scale(1.15)" fill="url(#verdeClaro)"/>
    <use href="#folha"  transform="translate(1470 90)  rotate(134) scale(1.00)" fill="url(#palha)"/>

    <use href="#folha"  transform="translate(340 940)  rotate(-52) scale(1.05)" fill="url(#verdeMedio)"/>
    <use href="#fronde" transform="translate(1120 980) rotate(-116) scale(1.10)" fill="url(#verdeClaro)"/>
  </g>

  <!-- luz, sombra e um grão bem leve por cima (dá textura de foto) -->
  <rect width="1600" height="1000" fill="url(#luz)"/>
  <rect width="1600" height="1000" fill="url(#sombra)"/>
  <rect width="1600" height="1000" filter="url(#grao)" opacity=".055"/>
</svg>
